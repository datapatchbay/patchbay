[project]
name = "datapatchbay"
version = "0.0.0"
description = "Data products as code. Declare owners, ports and freshness in YAML, then scaffold, validate and generate from one lightweight CLI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "ruamel-yaml>=0.19.1",
    "typer>=0.29.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ty>=0.0.101",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.2.0",
    "sphinx>=9.1.1",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true

[tool.ty.src]
# assets/build.py is a standalone script with its own dependencies (fontTools, Pillow).
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true
