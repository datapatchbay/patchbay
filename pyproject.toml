[project]
name = "datapatchbay"
version = "0.0.0"
description = "Data products as code. Declare owners, ports and freshness in YAML, then scaffold, validate and generate from one lightweight CLI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "ruamel-yaml>=0.19.1",
    "typer>=0.29.1",
]

[project.scripts]
dpb = "datapatchbay.cli:main"

[project.entry-points."datapatchbay.orchestrators"]
airflow = "datapatchbay.builtin.airflow:AirflowOrchestrator"

[project.entry-points."datapatchbay.executors"]
python = "datapatchbay.builtin.python_executor:PythonExecutor"

[project.entry-points."datapatchbay.runtimes"]
worker = "datapatchbay.builtin.worker:WorkerRuntime"
docker = "datapatchbay.builtin.docker:DockerRuntime"
kubernetes = "datapatchbay.builtin.kubernetes:KubernetesRuntime"

[project.entry-points."datapatchbay.warehouses"]
postgres = "datapatchbay.builtin.postgres:PostgresWarehouse"

[build-system]
requires = ["uv_build>=0.10.4,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "ruff>=0.15.0",
    "ty>=0.0.101",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.2.0",
    "sphinx>=9.1.1",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true
# Helper modules such as plugin_fakes.py sit next to the tests and are imported by name.
pythonpath = ["tests/datapatchbay"]

[tool.ty.environment]
extra-paths = ["tests/datapatchbay"]

[tool.ty.src]
# assets/build.py is a standalone script with its own dependencies (fontTools, Pillow).
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
line-length = 120
target-version = "py312"
# assets/build.py and docs/conf.py are standalone tooling scripts, outside src and tests.
extend-exclude = ["assets", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "A", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
# Tests are plain functions; fixtures are injected, not imported.
"tests/**" = ["B018"]
# The expected DAG file is compared as a whole, so its long header comment stays on one line.
"tests/datapatchbay/test_generate.py" = ["E501"]
