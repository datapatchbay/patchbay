[project]
name = "datapatchbay"
version = "0.0.0"
description = "Data products as code. Declare owners, ports and freshness in YAML, then scaffold, validate and generate from one lightweight CLI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
# No CLI package yet; the project only carries the docs toolchain for now.
package = false

[dependency-groups]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.2.0",
    "sphinx>=9.1.1",
]
