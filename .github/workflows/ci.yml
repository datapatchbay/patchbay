name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python) through newest stable.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked pytest

  ty:
    name: ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # ty checks against the oldest supported Python, taken from requires-python.
      - name: Type check
        run: uv run --locked ty check --output-format github

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Lint
        run: uv run --locked ruff check --output-format github

      - name: Check formatting
        run: uv run --locked ruff format --check

  airflow:
    name: generated DAGs load in Airflow 3
    runs-on: ubuntu-latest
    env:
      # Airflow is installed for this job only, in its own virtual environment and with its constraints file. It is
      # not a dependency of datapatchbay, and datapatchbay is not installed in that environment.
      AIRFLOW_VERSION: "3.4.0"
      AIRFLOW_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Generate the DAGs of the fixture repo
        working-directory: tests/airflow/repo
        run: uv run --locked --project ../../.. dpb generate --output "$RUNNER_TEMP/dags"

      - name: Install Airflow outside the project lock
        run: |
          uv venv "$RUNNER_TEMP/airflow-venv" --python "$AIRFLOW_PYTHON"
          uv pip install --python "$RUNNER_TEMP/airflow-venv/bin/python" \
            "apache-airflow==${AIRFLOW_VERSION}" \
            apache-airflow-providers-common-sql \
            apache-airflow-providers-docker \
            apache-airflow-providers-cncf-kubernetes \
            apache-airflow-providers-postgres \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${AIRFLOW_PYTHON}.txt"

      - name: Load the DAGs with a DagBag and fail on any import error
        run: |
          "$RUNNER_TEMP/airflow-venv/bin/python" tests/airflow/check_dags.py "$RUNNER_TEMP/dags" \
            sa_ilab_orders apply_access,audit_orders,build_ingested_orders,build_orders,publish_outputs \
            agg_lab_turnaround apply_access,build_turnaround,publish_outputs \
            agg_lab_weekly apply_access,build_weekly_raw,build_weekly,build_weekly_pod,publish_outputs

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # Tests marked `postgres` create a database and roles of their own, so the user must be a superuser.
      DPB_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Run the tests that need Postgres
        run: uv run --locked pytest -m postgres
