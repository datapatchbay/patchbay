name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python) through newest stable.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked pytest

  ty:
    name: ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # ty checks against the oldest supported Python, taken from requires-python.
      - name: Type check
        run: uv run --locked ty check --output-format github

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Lint
        run: uv run --locked ruff check --output-format github

      - name: Check formatting
        run: uv run --locked ruff format --check

  airflow:
    name: generated DAGs load in Airflow 3
    runs-on: ubuntu-latest
    env:
      # Airflow is installed for this job only, in its own virtual environment and with its constraints file. It is
      # not a dependency of datapatchbay, and datapatchbay is not installed in that environment.
      AIRFLOW_VERSION: "3.4.0"
      AIRFLOW_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Generate the DAGs of the fixture repo
        working-directory: tests/airflow/repo
        run: uv run --locked --project ../../.. dpb generate --output "$RUNNER_TEMP/dags"

      - name: Install Airflow outside the project lock
        run: |
          uv venv "$RUNNER_TEMP/airflow-venv" --python "$AIRFLOW_PYTHON"
          uv pip install --python "$RUNNER_TEMP/airflow-venv/bin/python" \
            "apache-airflow==${AIRFLOW_VERSION}" \
            apache-airflow-providers-common-sql \
            apache-airflow-providers-docker \
            apache-airflow-providers-cncf-kubernetes \
            apache-airflow-providers-postgres \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${AIRFLOW_PYTHON}.txt"

      - name: Load the DAGs with a DagBag and fail on any import error
        run: |
          "$RUNNER_TEMP/airflow-venv/bin/python" tests/airflow/check_dags.py "$RUNNER_TEMP/dags" \
            sa_jaffle_orders apply_access,audit_orders,build_ingested_orders,build_orders,publish_outputs \
            agg_order_turnaround apply_access,build_turnaround,publish_outputs \
            agg_weekly_orders apply_access,build_weekly_raw,build_weekly,build_weekly_pod,build_dbt,publish_outputs

      - name: Generate and load the DAGs of the example repo
        working-directory: examples/jaffle_shop
        run: |
          uv run --locked --project ../.. dpb generate --output "$RUNNER_TEMP/example-dags"
          "$RUNNER_TEMP/airflow-venv/bin/python" ../../tests/airflow/check_dags.py "$RUNNER_TEMP/example-dags" \
            sa_jaffle_orders apply_access,audit_orders,build_ingested_orders,build_orders,publish_outputs \
            agg_order_turnaround apply_access,build_dbt,publish_outputs

  example:
    name: example repo runs end to end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      AIRFLOW_VERSION: "3.4.0"
      AIRFLOW_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # dbt is installed from the project's `dbt` dependency group, in the project environment, because its pins conflict
      # with Airflow's. Only the `dbt` command is used from there: the `build_dbt` task finds it through the PATH.
      - name: Generate the DAGs of the example repo
        working-directory: examples/jaffle_shop
        run: uv run --locked --group dbt --project ../.. dpb generate --output "$RUNNER_TEMP/dags"

      # `dpb validate` reads the dbt manifest to check what the dbt model reads, so `dbt parse` comes first.
      - name: Parse the dbt project of the example repo and validate it
        working-directory: examples/jaffle_shop
        run: |
          uv run --locked --group dbt --project ../.. dbt parse --project-dir . --profiles-dir .
          uv run --locked --group dbt --project ../.. dpb validate

      - name: Install Airflow outside the project lock
        run: |
          uv venv "$RUNNER_TEMP/airflow-venv" --python "$AIRFLOW_PYTHON"
          uv pip install --python "$RUNNER_TEMP/airflow-venv/bin/python" \
            "apache-airflow==${AIRFLOW_VERSION}" \
            apache-airflow-providers-common-sql \
            apache-airflow-providers-postgres \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${AIRFLOW_PYTHON}.txt"

      # Runs both generated DAGs with `dag.test()` against the Postgres service (the dbt DAG runs the real `dbt build`
      # with its data tests), then reads the views as a reader and as a PII reader. The roles are created by the script
      # (ADR-0017).
      - name: Run the DAGs and read the output ports
        run: |
          PATH="$RUNNER_TEMP/airflow-venv/bin:$PATH" python tests/airflow/run_example.py "$RUNNER_TEMP/dags" \
            postgresql://postgres:postgres@localhost:5432/postgres "$GITHUB_WORKSPACE/.venv/bin"

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # `dbt build` against Postgres is an integration test (scripts/integration-tests), so no database is started here.
      # dbt is installed for this test only. It is never a dependency of the package.
      - name: Parse the generated dbt properties and tests
        env:
          DPB_REQUIRE_DBT: "1"  # a missing dbt fails the test instead of skipping it
        run: uv run --locked --group dbt pytest -m dbt
