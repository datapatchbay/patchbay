name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that only changes the docs site or the agent notes skips every other job. Pushes to main and manual
  # runs always run everything. The list of paths mirrors what docs.yml builds from, minus the files the tests read.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')"
          echo "$files"
          # An empty list counts as code, so a failure to list the files never skips the checks.
          if grep -qvE '^(docs/|assets/|README\.md$|GLOSSARY\.md$|AGENTS\.md$|CODING_STANDARDS\.md$|LICENSE$|\.github/workflows/docs\.yml$)' <<<"$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python) through newest stable.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked pytest -n auto

  ty:
    name: ty
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # ty checks against the oldest supported Python, taken from requires-python.
      - name: Type check
        run: uv run --locked ty check --output-format github

  ruff:
    name: ruff
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Lint
        run: uv run --locked ruff check --output-format github

      - name: Check formatting
        run: uv run --locked ruff format --check

  dbt:
    name: dbt parse
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # `dbt build` against Postgres is an integration test (scripts/integration-tests), so no database is started here.
      # dbt is installed for this test only. It is never a dependency of the package.
      - name: Parse the generated dbt properties and tests
        env:
          DPB_REQUIRE_DBT: "1"  # a missing dbt fails the test instead of skipping it
        run: uv run --locked --group dbt pytest -n auto -m dbt

  # The one check the ruleset on main requires, so that the list of jobs can change without touching the ruleset.
  # A skipped job (a docs-only pull request) counts as passed.
  ci-ok:
    name: ci ok
    needs: [changes, pytest, ty, ruff, dbt]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
